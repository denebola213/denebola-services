# Local-managed tunnel config example (alternative to the token method).
#
# Use this only if you chose the local-config.yml tunnel management model.
# 1) Create a locally-managed tunnel and credentials JSON:
#      cloudflared tunnel create hermes
#    => credentials saved to ~/.cloudflared/<TUNNEL-UUID>.json
# 2) Put this file and the credentials JSON into ~/hermes/cloudflared/
# 3) Route DNS once (add the agent hostname too if you expose the CLI/API):
#      cloudflared tunnel route dns hermes hermes.example.com
#      cloudflared tunnel route dns hermes agent.example.com
#      cloudflared tunnel route dns hermes dashboard.example.com
# 4) Replace the Exec/Volume lines in cloudflared.container with the ones
#    documented in README.md ("ローカル config.yml 方式").

tunnel: <TUNNEL-UUID>
credentials-file: /etc/cloudflared/<TUNNEL-UUID>.json

ingress:
  # WebUI (browser)
  - hostname: hermes.example.com
    service: http://hermes-webui:8787
  # Agent gateway API (OpenAI-compatible) for CLI / curl / SDK / other clients
  - hostname: agent.example.com
    service: http://hermes-agent:8642
  # Built-in management dashboard (needs HERMES_DASHBOARD=1 + basic auth)
  - hostname: dashboard.example.com
    service: http://hermes-agent:9119
  - service: http_status:404
